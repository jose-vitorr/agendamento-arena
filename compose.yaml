services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=agendamentoarena'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
    volumes:
      - 'agendamentoarena_pgdata:/var/lib/postgresql/data'

  rabbitmq:
    image: 'rabbitmq:latest'
    environment:
      - 'RABBITMQ_DEFAULT_PASS=secret'
      - 'RABBITMQ_DEFAULT_USER=myuser'
    ports:
      - '5672'

volumes:
  agendamentoarena_pgdata: